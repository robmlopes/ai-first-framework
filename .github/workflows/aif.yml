name: aif

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: aif check
        run: aif check --json | tee aif-report.json
      - name: Framework tests
        run: python -m pytest tests/framework -q
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aif-report
          path: aif-report.json
